<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Sói Trận Chiến - Trợ Năng</title>
    <!-- Liên kết tới file CSS giao diện (sẽ làm sau) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="game-container">
        <!-- Khu vực 1: Màn hình đăng nhập / Khởi tạo người chơi -->
        <section id="login-screen" aria-label="Màn hình đăng nhập">
            <h1>Đăng Nhập Vào Làng Ma Sói</h1>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="player-name">Nhập tên của bạn:</label>
                    <input type="text" id="player-name" placeholder="Ví dụ: Wardiy" required aria-required="true">
                </div>

                <div class="form-group">
                    <label for="avatar-select">Chọn ảnh đại diện:</label>
                    <select id="avatar-select" aria-label="Chọn ảnh đại diện">
                        <option value="avatar1">Hiệp sĩ áo giáp</option>
                        <option value="avatar2">Sói xám hoang dã</option>
                        <option value="avatar3">Phù thủy kỳ bí</option>
                        <option value="avatar4">Dân làng hiền lành</option>
                    </select>
                </div>

                <button type="submit" id="btn-start-lobby" aria-label="Nút bấm: Vào sảnh chờ">Vào Sảnh Chờ</button>
            </form>
        </section>

        <!-- Khu vực 2: Sảnh chờ chọn số lượng người chơi (5 đến 15 người) -->
        <section id="lobby-screen" style="display: none;" aria-label="Sảnh chờ ván đấu">
            <h2>Phòng Chờ Lập Bản Đồ Săn Sói</h2>
            <p>Chọn tổng số lượng người tham gia ván đấu (từ 5 đến 15 người, bao gồm cả người thật và Bot):</p>
            
            <div class="form-group">
                <label for="player-count">Số lượng người chơi:</label>
                <select id="player-count" aria-label="Chọn tổng số lượng người chơi từ 5 đến 15">
                    <option value="5">5 Người chơi</option>
                    <option value="7">7 Người chơi</option>
                    <option value="9" selected>9 Người chơi (Tiêu chuẩn)</option>
                    <option value="12">12 Người chơi</option>
                    <option value="15">15 Người chơi (Đại chiến)</option>
                </select>
            </div>

            <button type="button" id="btn-launch-game" aria-label="Nút bấm: Bắt đầu ván đấu">Bắt Đầu Ván Đấu</button>
        </section>

        <!-- Khu vực động (Dynamic): Nơi hiển thị danh sách người chơi và bảng game sau khi bắt đầu -->
        <div id="dynamic-game-board" aria-live="polite">
            <!-- JavaScript sẽ tự động bơm nội dung vào đây, file HTML này không cần sửa nữa -->
        </div>
    </main>

    <!-- Liên kết tới các file JavaScript điều khiển -->
    <script src="game.js"></script>
</body>
</html>
